<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>网站管理</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #30363d;
    --text:    #c9d1d9;
    --dim:     #8b949e;
    --accent:  #58a6ff;
    --green:   #3fb950;
    --red:     #f85149;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .hidden { display: none !important; }

  /* ── 顶部 ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
  header h1 { font-size: 1.05rem; font-weight: 700; color: #f0f6fc; }
  .header-actions { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  #user-info { font-size: 12px; color: var(--dim); }
  #clock { font-size: 12px; color: var(--dim); }

  button {
    background: #21262d;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }

  input, select {
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    padding: 6px 10px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }

  #banner { padding: 10px 20px; font-size: 13px; }

  /* ── 登录 ── */
  #login-view {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .login-card {
    width: 340px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .login-card h2 { font-size: 15px; color: #f0f6fc; }
  .login-card input { width: 100%; }
  .login-card button { width: 100%; }
  .err { font-size: 12px; color: var(--red); }

  /* ── 标签页 ── */
  #app-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 10px 20px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .tab {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    border-radius: 0;
    color: var(--dim);
    padding: 8px 16px;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  section.panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .filters label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .filters input[type="text"] { width: 140px; }
  .filters input[type="number"] { width: 70px; }
  .filters input[type="date"] { width: 140px; }
  .status { font-size: 12px; color: var(--dim); margin-left: auto; }

  .summary {
    padding: 12px 20px;
    font-size: 13px;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  #sum-text { flex: 1; }
  #host-status { margin-left: 0; }

  /* ── 统计表 ── */
  .stats-main { flex: 1; display: flex; min-height: 0; }
  .stats-main .table-wrap { flex: 1; min-width: 0; overflow-y: auto; padding: 0 20px 20px; }
  #ip-preview {
    width: 38%;
    min-width: 320px;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: var(--surface);
  }
  .preview-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #preview-title {
    font-size: 13px;
    font-weight: 600;
    color: #f0f6fc;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #preview-status { padding: 6px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  #preview-body {
    flex: 1;
    overflow-y: auto;
    margin: 0;
    padding: 10px 14px;
    font-family: Consolas, Menlo, monospace;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
  }
  tbody tr.selected { background: #1f3a6e; }
  tbody tr.selected:hover { background: #1f3a6e; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; }
  th, td {
    text-align: left;
    padding: 8px 12px;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--dim); font-weight: 600; position: sticky; top: 0; background: var(--bg); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--accent); }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #1c2129; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.ip { color: var(--accent); font-family: Consolas, Menlo, monospace; }
  td.host-cell { color: var(--dim); font-size: 12px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 日志浏览 ── */
  #log-view {
    flex: 1;
    overflow-y: auto;
    margin: 0;
    padding: 14px 20px;
    font-family: Consolas, Menlo, monospace;
    font-size: 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
    color: var(--text);
  }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>网站管理</h1>
  <div class="header-actions">
    <span id="user-info"></span>
    <button id="btn-logout" class="hidden">退出</button>
    <p id="clock"></p>
  </div>
</header>

<div id="banner" class="hidden"></div>

<!-- ── 登录视图 ── -->
<div id="login-view" class="hidden">
  <form id="login-form" class="login-card">
    <h2>管理员登录</h2>
    <input id="login-user" type="text" placeholder="用户名" autocomplete="username">
    <input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
    <p id="login-err" class="err hidden"></p>
    <button type="submit">登录</button>
  </form>
</div>

<!-- ── 主视图 ── -->
<main id="app-view" class="hidden">
  <nav class="tabs">
    <button id="tab-btn-stats" class="tab active">IP 统计</button>
    <button id="tab-btn-logs" class="tab">日志浏览</button>
  </nav>

  <section id="panel-stats" class="panel">
    <div class="filters">
      <label>日志文件
        <select id="stats-file"></select>
      </label>
      <label>开始
        <input id="stats-date-from" type="date">
        <input id="stats-time-from" type="text" placeholder="HH:MM" style="width:64px">
      </label>
      <label>结束
        <input id="stats-date-to" type="date">
        <input id="stats-time-to" type="text" placeholder="HH:MM" style="width:64px">
      </label>
      <label>路径
        <input id="stats-path" type="text" placeholder="路径关键字">
      </label>
      <label>IP
        <input id="stats-ip" type="text" placeholder="IP 关键字">
      </label>
      <label>TOP
        <input id="stats-top" type="number" min="1" max="500" value="100">
      </label>
      <button id="btn-stats">统计</button>
      <span id="stats-status" class="status"></span>
    </div>
    <div id="stats-summary" class="summary hidden">
      <span id="sum-text"></span>
      <button id="btn-resolve-all">解析全部主机名</button>
      <button id="btn-export-ip">导出IP</button>
      <span id="host-status" class="status"></span>
    </div>
    <div class="stats-main">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th style="width:60px">#</th>
            <th class="sortable" id="th-ip">IP</th>
            <th class="sortable" id="th-count" style="width:110px">访问次数</th>
            <th class="sortable" id="th-last" style="width:180px">最近访问</th>
            <th>主机名</th>
          </tr></thead>
          <tbody id="stats-body"></tbody>
        </table>
      </div>
      <aside id="ip-preview" class="hidden">
        <div class="preview-head">
          <span id="preview-title">IP 日志预览</span>
          <button id="btn-preview-close">关闭</button>
        </div>
        <div id="preview-status" class="status"></div>
        <pre id="preview-body"></pre>
      </aside>
    </div>
  </section>

  <section id="panel-logs" class="panel hidden">
    <div class="filters">
      <label>日志文件
        <select id="log-file"></select>
      </label>
      <button id="btn-log-more">加载更多</button>
      <button id="btn-log-tail">跳到尾部</button>
      <label>过滤
        <input id="log-filter" type="text" placeholder="关键字">
      </label>
      <span id="log-status" class="status"></span>
    </div>
    <pre id="log-view"></pre>
  </section>
</main>

<script>
'use strict';
(function () {
  var BLOCK = 200 * 1024;
  var state = { user: null, files: [], logLines: [], logOffset: 0, logTotal: 0, logFile: '',
                statsIps: [], sortKey: 'count', sortDir: -1, hostMap: {}, selectedIp: null };

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s).split('&').join('&amp;').split('<').join('&lt;')
                   .split('>').join('&gt;').split('"').join('&quot;');
  }
  function showBanner(msg, isErr) {
    var b = $('banner');
    b.textContent = msg;
    b.style.background = isErr ? '#3a1a1a' : '#1a3a24';
    b.style.color = isErr ? '#f85149' : '#3fb950';
    b.classList.remove('hidden');
  }
  function hideBanner() { $('banner').classList.add('hidden'); }

  async function apiGet(url, signal) {
    var res = await fetch(url, signal ? { signal: signal } : undefined);
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }
  async function apiPost(url, body) {
    var res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    var data = await res.json();
    if (!data.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  /* ── 登录 / 鉴权 ── */
  function showLogin(errMsg) {
    $('app-view').classList.add('hidden');
    $('btn-logout').classList.add('hidden');
    $('user-info').textContent = '';
    $('login-view').classList.remove('hidden');
    if (errMsg) {
      var e = $('login-err');
      e.textContent = errMsg;
      e.classList.remove('hidden');
    }
  }
  function showApp(user) {
    state.user = user;
    $('login-view').classList.add('hidden');
    $('app-view').classList.remove('hidden');
    $('btn-logout').classList.remove('hidden');
    $('user-info').textContent = user.displayName || user.username;
    loadLogFiles();
  }

  async function init() {
    try {
      var d = await apiGet('/api/wiki-auth-status');
      if (d.loggedIn && d.user) {
        if (d.user.role === 'admin') showApp(d.user);
        else showLogin('当前账号无管理员权限');
      } else {
        showLogin('');
      }
    } catch (e) {
      showLogin('无法连接服务器：' + e.message);
    }
  }

  $('login-form').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var u = $('login-user').value.trim();
    var p = $('login-pass').value;
    if (!u || !p) return;
    apiPost('/api/wiki-login', { username: u, password: p }).then(function (d) {
      if (d.user && d.user.role === 'admin') location.reload();
      else {
        apiPost('/api/wiki-logout', null).catch(function () {});
        showLogin('当前账号无管理员权限');
      }
    }).catch(function (e) {
      showLogin(e.message);
    });
  });

  $('btn-logout').addEventListener('click', function () {
    apiPost('/api/wiki-logout', null).then(function () { location.reload(); })
      .catch(function () { location.reload(); });
  });

  /* ── 标签切换 ── */
  $('tab-btn-stats').addEventListener('click', function () {
    $('tab-btn-stats').classList.add('active');
    $('tab-btn-logs').classList.remove('active');
    $('panel-stats').classList.remove('hidden');
    $('panel-logs').classList.add('hidden');
  });
  $('tab-btn-logs').addEventListener('click', function () {
    $('tab-btn-logs').classList.add('active');
    $('tab-btn-stats').classList.remove('active');
    $('panel-logs').classList.remove('hidden');
    $('panel-stats').classList.add('hidden');
  });

  /* ── 日志文件列表 ── */
  async function loadLogFiles() {
    try {
      var d = await apiGet('/api/admin-log-files');
      state.files = d.files || [];
      var sf = $('stats-file'), lf = $('log-file');
      sf.innerHTML = '<option value="">全部文件</option>';
      lf.innerHTML = '';
      for (var i = 0; i < state.files.length; i++) {
        var n = esc(state.files[i].name);
        sf.innerHTML += '<option value="' + n + '">' + n + '</option>';
        lf.innerHTML += '<option value="' + n + '">' + n + '</option>';
      }
      if (state.files.length) {
        lf.value = state.files[state.files.length - 1].name;
        resetLogs();
      }
    } catch (e) {
      showBanner('获取日志文件列表失败：' + e.message, true);
    }
  }

  /* ── IP 统计 ── */
  function fmtTime(s) {
    var p = function (x) { return x < 10 ? '0' + x : String(x); };
    return s.substring(0, 4) + '-' + s.substring(5, 7) + '-' + s.substring(8, 10) +
           ' ' + s.substring(11, 13) + ':' + s.substring(14, 16) + ':' + s.substring(17, 19);
  }
  function ipToNum(ip) {
    var p = ip.split('.');
    return ((+p[0]) * 16777216) + ((+p[1]) * 65536) + ((+p[2]) * 256) + (+p[3]);
  }
  function sortStats() {
    var key = state.sortKey, dir = state.sortDir;
    state.statsIps.sort(function (a, b) {
      var r = 0;
      if (key === 'ip') {
        r = ipToNum(a.ip) - ipToNum(b.ip);
        if (r === 0) r = a.count - b.count;
      } else if (key === 'count') {
        r = a.count - b.count;
        if (r === 0) r = ipToNum(a.ip) - ipToNum(b.ip);
      } else {
        var la = a.last || '', lb = b.last || '';
        r = la < lb ? -1 : (la > lb ? 1 : 0);
        if (r === 0) r = a.count - b.count;
      }
      return r * dir;
    });
  }
  function renderStatsBody() {
    var rows = '';
    for (var i = 0; i < state.statsIps.length; i++) {
      var it = state.statsIps[i];
      var host = state.hostMap[it.ip];
      rows += '<tr data-ip="' + esc(it.ip) + '"' +
              (state.selectedIp === it.ip ? ' class="selected"' : '') + '>' +
              '<td class="num">' + (i + 1) + '</td>' +
              '<td class="ip">' + esc(it.ip) + '</td>' +
              '<td class="num">' + it.count + '</td>' +
              '<td>' + (it.last ? fmtTime(it.last) : '') + '</td>' +
              '<td class="host-cell" id="hostcell-' + i + '"' +
              (host ? ' title="' + esc(host) + '"' : '') + '>' +
              (host ? esc(host) : '—') + '</td></tr>';
    }
    $('stats-body').innerHTML = rows || '<tr><td colspan="5">无匹配记录</td></tr>';
    updateSortArrows();
  }
  function updateSortArrows() {
    var arr = { count: '', last: '', ip: '' };
    arr[state.sortKey] = state.sortDir < 0 ? ' ↓' : ' ↑';
    $('th-count').innerHTML = '访问次数' + arr.count;
    $('th-last').innerHTML = '最近访问' + arr.last;
    $('th-ip').innerHTML = 'IP' + arr.ip;
  }
  function onSortClick(key) {
    if (state.sortKey === key) state.sortDir = -state.sortDir;
    else { state.sortKey = key; state.sortDir = key === 'count' ? -1 : 1; }
    sortStats();
    renderStatsBody();
  }
  $('th-ip').addEventListener('click', function () { onSortClick('ip'); });
  $('th-count').addEventListener('click', function () { onSortClick('count'); });
  $('th-last').addEventListener('click', function () { onSortClick('last'); });

  /* 主机名解析：并发 6，结果按 IP 缓存，排序重渲染后不丢失 */
  function resolveHostnames(fromIdx, toIdx, onDone) {
    var idxs = [];
    for (var i = fromIdx; i < toIdx && i < state.statsIps.length; i++) idxs.push(i);
    var total = idxs.length, done = 0;
    function statusText() {
      $('host-status').textContent = total > 0 ? '主机名解析 ' + done + '/' + total : '';
    }
    if (!total) { statusText(); if (onDone) onDone(); return; }
    statusText();
    var next = 0, active = 0;
    function finish() {
      active--;
      if (done >= total) { if (onDone) onDone(); return; }
      pump();
    }
    function one(i) {
      var ip = state.statsIps[i].ip;
      if (typeof state.hostMap[ip] !== 'undefined') {
        done++; statusText(); finish();
        return;
      }
      /* 8 秒超时：DNS 慢时放弃本次解析，不缓存，允许稍后重试 */
      var ctrl = null, timer = null;
      if (typeof AbortController !== 'undefined') {
        ctrl = new AbortController();
        timer = setTimeout(function () { ctrl.abort(); }, 8000);
      }
      apiGet('/api/admin-ip-host?ip=' + encodeURIComponent(ip), ctrl ? ctrl.signal : undefined).then(function (d) {
        state.hostMap[ip] = d.host || '';
        if (state.statsIps[i] && state.statsIps[i].ip === ip) {
          var cell = document.getElementById('hostcell-' + i);
          if (cell) {
            cell.textContent = d.host || '—';
            if (d.host) cell.title = d.host;
          }
        }
      }).catch(function () {
        if (state.statsIps[i] && state.statsIps[i].ip === ip) {
          var cell = document.getElementById('hostcell-' + i);
          if (cell) cell.textContent = '—';
        }
      }).then(function () {
        if (timer) clearTimeout(timer);
        done++; statusText(); finish();
      });
    }
    function pump() {
      while (active < 6 && next < idxs.length) { active++; one(idxs[next++]); }
    }
    pump();
  }
  $('btn-resolve-all').addEventListener('click', function () {
    resolveHostnames(0, state.statsIps.length);
  });

  /* 导出当前统计结果（当前排序顺序）为纯 IP 列表 txt */
  $('btn-export-ip').addEventListener('click', function () {
    var ips = [];
    for (var i = 0; i < state.statsIps.length; i++) ips.push(state.statsIps[i].ip);
    if (!ips.length) {
      showBanner('当前没有可导出的 IP，请先执行统计', false);
      return;
    }
    var now = new Date();
    var p = function (x) { return x < 10 ? '0' + x : String(x); };
    var fname = 'ip_export_' + now.getFullYear() + p(now.getMonth() + 1) + p(now.getDate()) +
                '_' + p(now.getHours()) + p(now.getMinutes()) + p(now.getSeconds()) + '.txt';
    var blob = new Blob([ips.join('\r\n') + '\r\n'], { type: 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    showBanner('已导出 ' + ips.length + ' 个 IP：' + fname, false);
  });

  $('btn-stats').addEventListener('click', function () {
    var q = [];
    var f = $('stats-file').value;
    if (f) q.push('file=' + encodeURIComponent(f));
    var from = $('stats-date-from').value;
    var t1 = $('stats-time-from').value.trim();
    if (from) q.push('from=' + encodeURIComponent(from + (t1 ? ' ' + t1 : '')));
    var to = $('stats-date-to').value;
    var t2 = $('stats-time-to').value.trim();
    if (to) q.push('to=' + encodeURIComponent(to + (t2 ? ' ' + t2 : '')));
    var pk = $('stats-path').value.trim();
    if (pk) q.push('path=' + encodeURIComponent(pk));
    var ik = $('stats-ip').value.trim();
    if (ik) q.push('ip=' + encodeURIComponent(ik));
    var top = parseInt($('stats-top').value, 10);
    if (!top || top < 1) top = 100;
    if (top > 500) top = 500;
    q.push('top=' + top);

    var btn = $('btn-stats');
    btn.disabled = true;
    $('stats-status').textContent = '统计中…';
    apiGet('/api/admin-ip-stats?' + q.join('&')).then(function (d) {
      state.statsIps = d.ips.slice();
      state.hostMap = {};
      state.sortKey = 'count';
      state.sortDir = -1;
      state.selectedIp = null;
      $('ip-preview').classList.add('hidden');
      sortStats();
      renderStatsBody();
      $('sum-text').textContent = '扫描 ' + d.scanned + ' 行 · 命中 ' + d.matched + ' 行 · 独立 IP ' +
                        d.unique + ' 个' + (d.ips.length < d.unique ? '（显示前 ' + d.ips.length + '）' : '');
      $('stats-summary').classList.remove('hidden');
      $('stats-status').textContent = '完成';
      resolveHostnames(0, 20);
    }).catch(function (e) {
      $('stats-status').textContent = '';
      showBanner('统计失败：' + e.message, true);
    }).then(function () { btn.disabled = false; });
  });

  /* 点击 IP 行 → 右侧预览该 IP 的日志 */
  function openIpPreview(ip) {
    state.selectedIp = ip;
    renderStatsBody();
    $('ip-preview').classList.remove('hidden');
    $('preview-title').textContent = ip + ' 的访问日志';
    $('preview-body').textContent = '';
    $('preview-status').textContent = '扫描中…';
    var f = $('stats-file').value;
    var url = '/api/admin-ip-logs?ip=' + encodeURIComponent(ip) + '&limit=500' +
              (f ? '&file=' + encodeURIComponent(f) : '');
    apiGet(url).then(function (d) {
      $('preview-body').textContent = d.data || '';
      var msg = '扫描 ' + d.scanned + ' 行 · 匹配 ' + d.matched + ' 条';
      if (d.truncated) msg += ' · 仅显示最后 ' + d.returned + ' 条';
      $('preview-status').textContent = msg;
    }).catch(function (e) {
      $('preview-status').textContent = '';
      $('preview-body').textContent = '加载失败：' + e.message;
    });
  }
  $('stats-body').addEventListener('click', function (ev) {
    var tr = ev.target;
    while (tr && tr !== $('stats-body') && tr.tagName !== 'TR') tr = tr.parentNode;
    if (!tr || tr.tagName !== 'TR') return;
    var ip = tr.getAttribute('data-ip');
    if (!ip) return;
    openIpPreview(ip);
  });
  $('btn-preview-close').addEventListener('click', function () {
    $('ip-preview').classList.add('hidden');
    state.selectedIp = null;
    renderStatsBody();
  });

  /* ── 日志浏览 ── */
  function resetLogs() {
    state.logLines = [];
    state.logOffset = 0;
    state.logTotal = 0;
    state.logFile = $('log-file').value;
    renderLogs();
    loadLogBlock();
  }
  function loadLogBlock() {
    if (!state.logFile) return;
    var url = '/api/admin-log-read?file=' + encodeURIComponent(state.logFile) +
              '&offset=' + state.logOffset + '&limit=' + BLOCK;
    $('log-status').textContent = '加载中…';
    apiGet(url).then(function (d) {
      state.logTotal = d.total;
      appendLines(d.data);
      state.logOffset = d.offset + d.size;
      renderLogs();
    }).catch(function (e) {
      showBanner('读取日志失败：' + e.message, true);
    });
  }
  function appendLines(data) {
    if (!data) return;
    var parts = data.split('\n');
    /* 与上一块末尾的半行拼接 */
    if (state.logLines.length && parts.length) {
      state.logLines[state.logLines.length - 1] += parts[0];
      parts = parts.slice(1);
    }
    for (var i = 0; i < parts.length; i++) state.logLines.push(parts[i]);
  }
  function renderLogs() {
    var kw = $('log-filter').value.trim();
    var lines = kw
      ? state.logLines.filter(function (l) { return l.toLowerCase().indexOf(kw.toLowerCase()) !== -1; })
      : state.logLines;
    $('log-view').textContent = lines.join('\n');
    var pct = state.logTotal > 0 ? Math.round(state.logOffset / state.logTotal * 100) : 100;
    var msg = '已加载 ' + state.logOffset + ' / ' + state.logTotal + ' 字节 (' + pct + '%)';
    if (kw) msg += ' · 匹配 ' + lines.length + ' 行';
    $('log-status').textContent = msg;
  }
  $('btn-log-more').addEventListener('click', function () {
    if (state.logOffset < state.logTotal) loadLogBlock();
  });
  $('btn-log-tail').addEventListener('click', function () {
    if (!state.logFile || state.logTotal === 0) return;
    state.logLines = [];
    state.logOffset = Math.max(0, state.logTotal - BLOCK);
    loadLogBlock();
  });
  $('log-filter').addEventListener('input', renderLogs);
  $('log-file').addEventListener('change', resetLogs);

  /* ── 时钟 ── */
  var cl = $('clock');
  function tick() { cl.textContent = new Date().toLocaleString('zh-CN', { hour12: false }); }
  tick();
  setInterval(tick, 1000);

  init();
})();
</script>
</body>
</html>
